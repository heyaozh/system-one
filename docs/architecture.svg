<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <style>
      .box { fill:#ffffff; stroke:#5b6b7a; stroke-width:1.4; rx:8; }
      .lane { fill:#f4f6f8; stroke:#d5dbe1; stroke-width:1; rx:12; }
      .title { font-weight:600; fill:#1f2933; }
      .muted { fill:#5b6b7a; font-size:11.5px; }
      .edge { stroke:#5b6b7a; stroke-width:1.4; fill:none; marker-end:url(#arr); }
      .edge-dash { stroke:#8a97a4; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arr); }
      .accent { fill:#fff7e6; stroke:#d99a2b; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; fill:#1f2933; }
    </style>
  </defs>

  <text x="24" y="30" font-size="18" class="title">jev — decision → probability → record → calibrate</text>
  <text x="24" y="50" class="muted">Your code only writes types (lane 1). Lanes 2–4 are shared across projects and backends.</text>

  <!-- Lane 1: your code -->
  <rect x="24" y="66" width="992" height="118" class="lane"/>
  <text x="36" y="86" class="title">1 · Your code (per project)</text>

  <rect x="40" y="98" width="296" height="72" class="box"/>
  <text x="52" y="118" class="code">#[derive(JevChoice)] enum Verdict {…}</text>
  <text x="52" y="136" class="code">#[derive(JevQuestions)] struct RiskGate {</text>
  <text x="52" y="154" class="code">  ok: Noul, verdict: Choice&lt;Verdict&gt; }</text>

  <rect x="350" y="98" width="320" height="72" class="box"/>
  <text x="362" y="118" class="code">let g: RiskGate = engine.ask(&amp;order).await?;</text>
  <text x="362" y="136" class="code">g.verdict.decide(cost)      // action</text>
  <text x="362" y="154" class="code">g.ok.entropy()              // uncertainty</text>

  <rect x="690" y="98" width="310" height="72" class="box"/>
  <text x="702" y="118" class="title">state = anything Serialize</text>
  <text x="702" y="136" class="muted">a string, a struct, chat history, a book snapshot…</text>
  <text x="702" y="154" class="muted">questions = the struct's fields (asked in parallel)</text>

  <!-- Lane 2: engine -->
  <rect x="24" y="200" width="992" height="96" class="lane"/>
  <text x="36" y="220" class="title">2 · Engine (shared)</text>
  <rect x="40" y="232" width="150" height="50" class="box"/>
  <text x="52" y="252" class="title">schema()</text>
  <text x="52" y="270" class="muted">types → API JSON</text>
  <rect x="210" y="232" width="150" height="50" class="box"/>
  <text x="222" y="252" class="title">cache</text>
  <text x="222" y="270" class="muted">(state, schema) hash</text>
  <rect x="380" y="232" width="150" height="50" class="box"/>
  <text x="392" y="252" class="title">ask_many</text>
  <text x="392" y="270" class="muted">N in flight, ordered</text>
  <rect x="550" y="232" width="150" height="50" class="box"/>
  <text x="562" y="252" class="title">from_raw()</text>
  <text x="562" y="270" class="muted">JSON → typed answers</text>
  <rect x="720" y="232" width="280" height="50" class="box accent"/>
  <text x="732" y="252" class="title">Recorder → runs/*.jsonl (Parquet)</text>
  <text x="732" y="270" class="muted">every (state, schema, answers, backend, ts)</text>

  <!-- Lane 3: backends -->
  <rect x="24" y="312" width="992" height="126" class="lane"/>
  <text x="36" y="332" class="title">3 · DecisionBackend trait — decide(state, schema) → RawAnswers</text>
  <rect x="40" y="348" width="170" height="72" class="box"/>
  <text x="52" y="368" class="title">JevHttp</text>
  <text x="52" y="386" class="muted">api.typesafe.ai/v1/systemone</text>
  <text x="52" y="402" class="muted">retry · backoff · jev-latest</text>
  <rect x="230" y="348" width="170" height="72" class="box"/>
  <text x="242" y="368" class="title">LocalLogprob</text>
  <text x="242" y="386" class="muted">your model via vLLM / llama.cpp</text>
  <text x="242" y="402" class="muted">label log-probs → distribution</text>
  <rect x="420" y="348" width="170" height="72" class="box"/>
  <text x="432" y="368" class="title">Replay</text>
  <text x="432" y="386" class="muted">answers from a recording</text>
  <text x="432" y="402" class="muted">free, reproducible backtests</text>
  <rect x="610" y="348" width="170" height="72" class="box"/>
  <text x="622" y="368" class="title">Mock</text>
  <text x="622" y="386" class="muted">rule or uniform</text>
  <text x="622" y="402" class="muted">unit tests, CI, demos</text>
  <rect x="800" y="348" width="200" height="72" class="box"/>
  <text x="812" y="368" class="title">Shadow(primary, shadow)</text>
  <text x="812" y="386" class="muted">return primary, record both</text>
  <text x="812" y="402" class="muted">A/B a new model, zero risk</text>

  <!-- Lane 4: loop -->
  <rect x="24" y="454" width="992" height="140" class="lane"/>
  <text x="36" y="474" class="title">4 · The loop (why it is a crate, not a wrapper)</text>
  <rect x="40" y="490" width="200" height="82" class="box"/>
  <text x="52" y="510" class="title">attach_outcomes()</text>
  <text x="52" y="528" class="muted">what actually happened,</text>
  <text x="52" y="544" class="muted">joined by state hash</text>
  <rect x="280" y="490" width="220" height="82" class="box"/>
  <text x="292" y="510" class="title">CalibrationReport</text>
  <text x="292" y="528" class="muted">Brier · log-loss · ECE</text>
  <text x="292" y="544" class="muted">reliability table per question</text>
  <text x="292" y="560" class="muted">"did 0.8 mean 80 %?"</text>
  <rect x="540" y="490" width="220" height="82" class="box"/>
  <text x="552" y="510" class="title">Training set</text>
  <text x="552" y="528" class="muted">rows + outcomes = labels</text>
  <text x="552" y="544" class="muted">distil / fine-tune a small model</text>
  <text x="552" y="560" class="muted">with a proper scoring rule</text>
  <rect x="800" y="490" width="200" height="82" class="box accent"/>
  <text x="812" y="510" class="title">Swap the backend</text>
  <text x="812" y="528" class="muted">shadow → primary,</text>
  <text x="812" y="544" class="muted">business code unchanged</text>

  <!-- edges -->
  <path class="edge" d="M185,170 L185,232"/>
  <path class="edge" d="M510,170 L510,232"/>
  <path class="edge" d="M845,170 L845,232"/>
  <path class="edge" d="M455,282 L455,348"/>
  <path class="edge" d="M860,282 L860,348"/>
  <path class="edge" d="M140,420 L140,490"/>
  <path class="edge" d="M240,531 L280,531"/>
  <path class="edge" d="M500,531 L540,531"/>
  <path class="edge" d="M760,531 L800,531"/>
  <path class="edge-dash" d="M900,490 C900,450 330,470 315,420"/>
  <text x="640" y="452" class="muted" text-anchor="middle">your model becomes a LocalLogprob backend</text>
</svg>
