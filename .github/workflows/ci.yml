name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every backend is feature-gated; each of these must compile on its own.
      - run: cargo check -p jev --no-default-features
      - run: cargo check -p jev --no-default-features --features derive
      - run: cargo check -p jev --no-default-features --features http
      - run: cargo check -p jev --features parquet

  # No fmt / clippy job yet: neither component is installed on the maintainer's
  # machine, so a `-D warnings` gate has never been run locally and would go red
  # on the first push. Add it once the tree is verified clean.
