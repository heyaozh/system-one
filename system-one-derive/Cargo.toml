[package]
name = "system-one-derive"
description = "Derive macros for the `system-one` crate: map Rust enums and structs to typed decision schemas"
keywords = ["derive", "macros", "system-one", "jev", "decision"]
categories = ["development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
heck = "0.5"
